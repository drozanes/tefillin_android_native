<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0B0F19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #FFFFFF;
    }
    .screen {
      width: 1080px;
      height: 1920px;
      background: #0B0F19;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* Promo Banner at top of screenshot */
    .promo-header {
      padding: 60px 40px 30px;
      text-align: center;
      direction: rtl;
      background: linear-gradient(180deg, rgba(15,23,42,0.9) 0%, rgba(11,15,25,0.7) 100%);
    }
    .promo-title {
      font-size: 52px;
      font-weight: 800;
      color: #38BDF8;
      margin-bottom: 12px;
    }
    .promo-sub {
      font-size: 26px;
      color: #94A3B8;
      font-weight: 500;
    }
    /* Phone frame / Camera View */
    .mirror-view {
      flex: 1;
      margin: 20px 40px;
      border-radius: 40px;
      background: radial-gradient(circle at 50% 45%, #1E293B 0%, #0F172A 60%, #080C14 100%);
      border: 3px solid #334155;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    /* Symmetry Optical Overlay */
    .center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(56,189,248,0.2) 0%, #38BDF8 30%, #38BDF8 70%, rgba(56,189,248,0.2) 100%);
      transform: translateX(-50%);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }
    .hairline-guide {
      position: absolute;
      top: 32%;
      left: 20%;
      right: 20%;
      height: 2px;
      background: rgba(245, 158, 11, 0.7);
      border-top: 2px dashed #F59E0B;
    }
    .hairline-label {
      position: absolute;
      top: -36px;
      right: 0;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #F59E0B;
      color: #FCD34D;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      direction: rtl;
    }
    /* Target reticle */
    .reticle {
      position: absolute;
      top: 26%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border: 2px dashed rgba(56, 189, 248, 0.6);
      border-radius: 16px;
    }
    /* App Header in Mirror */
    .in-app-header {
      position: absolute;
      top: 30px;
      left: 30px;
      right: 30px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 18px 26px;
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
      align-items: center;
    }
    .app-title-group {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 16px;
    }
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #F8FAFC;
    }
    .accuracy-tag {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ADE80;
      font-size: 16px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }
    /* Bottom in-app controls */
    .in-app-bottom {
      position: absolute;
      bottom: 30px;
      left: 30px;
      right: 30px;
      display: flex;
      gap: 14px;
      direction: rtl;
    }
    .btn {
      flex: 1;
      padding: 18px 0;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #475569;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      border-color: #38BDF8;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }
    .footer-note {
      padding: 20px 40px 40px;
      text-align: center;
      font-size: 20px;
      color: #64748B;
      direction: rtl;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="promo-header">
      <div class="promo-title">דיוק מושלם להנחת תפילין</div>
      <div class="promo-sub">קו אמצע אופטי, סיוע בגובה שורש השיער וזיהוי פנים מתקדם</div>
    </div>

    <div class="mirror-view">
      <div class="in-app-header">
        <div class="app-title-group">
          <div class="app-name">מראת תפילין</div>
        </div>
        <div class="accuracy-tag">✓ מיושר ומכוון</div>
      </div>

      <!-- Alignment guides -->
      <div class="center-line"></div>
      <div class="reticle"></div>
      <div class="hairline-guide">
        <div class="hairline-label">גובה שורש השיער (מקום תפילין)</div>
      </div>

      <div class="in-app-bottom">
        <div class="btn btn-primary">📖 סדר הנחה וברכות</div>
        <div class="btn">📜 הלכות</div>
        <div class="btn">💡 הנחיות</div>
      </div>
    </div>

    <div class="footer-note">
      🔒 100% פרטיות – עיבוד מלא במכשיר ללא שמירת תמונות
    </div>
  </div>
</body>
</html>
