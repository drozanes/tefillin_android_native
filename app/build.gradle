plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def bugReportWebhookUrl = localProperties.getProperty('tefillin.bug_report_webhook_url') ?: System.getenv('BUG_REPORT_WEBHOOK_URL') ?: "https://discord.com/api/webhooks/1562703388796522506/NvB2H8tOIDRt-OE3f68oDd2OrQIbZ8ogPwi9P4bL_j7D4PR1hFhhdLm6tCKvPhhgKtvN"

android {
    namespace 'com.drozanes.tefillin'
    compileSdk 35

    defaultConfig {
        applicationId "com.tefillin.mirror"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        buildConfigField "String", "BUG_REPORT_WEBHOOK_URL", "\"${bugReportWebhookUrl}\""
    }

    signingConfigs {
        release {
            def keystorePath = localProperties.getProperty('release.storeFile') ?: System.getenv('RELEASE_STORE_FILE') ?: 'release.keystore'
            def keystoreFile = rootProject.file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword localProperties.getProperty('release.storePassword') ?: System.getenv('RELEASE_STORE_PASSWORD') ?: ''
                keyAlias localProperties.getProperty('release.keyAlias') ?: System.getenv('RELEASE_KEY_ALIAS') ?: 'tefillin'
                keyPassword localProperties.getProperty('release.keyPassword') ?: System.getenv('RELEASE_KEY_PASSWORD') ?: ''
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    androidResources {
        noCompress 'onnx', 'task'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // MediaPipe Tasks Vision for 478 3D FaceLandmarker & GPU Delegate
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // ONNX Runtime Android with NNAPI / GPU / Multi-threaded SIMD acceleration
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // Kotlin Coroutines & Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
