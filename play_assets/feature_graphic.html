<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #0B0F19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .container {
      width: 1024px;
      height: 500px;
      background: radial-gradient(circle at 75% 50%, #172554 0%, #0B0F19 70%);
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      position: relative;
    }
    .text-section {
      text-align: right;
      direction: rtl;
      max-width: 520px;
      z-index: 2;
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38BDF8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 54px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 20px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .visual-section {
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .glow-circle {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(11, 15, 25, 0) 70%);
      filter: blur(20px);
    }
    svg.icon {
      width: 260px;
      height: 260px;
      z-index: 2;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.7));
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-section">
      <div class="badge">כיוון ודיוק כהלכה</div>
      <h1 class="title">מראת תפילין</h1>
      <p class="subtitle">קו אמצע אופטי ליישור בין העיניים, גובה שורש השיער, סדר הנחה, ברכות והלכות.</p>
      <div class="pills">
        <span class="pill">✓ 100% פרטיות אופליין</span>
        <span class="pill">✓ כל הנוסחים</span>
        <span class="pill">✓ דיוק סימטרי</span>
      </div>
    </div>
    <div class="visual-section">
      <div class="glow-circle"></div>
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
        <!-- Precision Mirror Outer Ring -->
        <circle cx="54" cy="54" r="48" fill="#151E32" stroke="#2E3F66" stroke-width="2" />
        <circle cx="54" cy="54" r="42" fill="#0D1322" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.7" />
        <!-- Symmetry Guideline -->
        <line x1="54" y1="10" x2="54" y2="28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
        <line x1="54" y1="80" x2="54" y2="98" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="54" x2="22" y2="54" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
        <line x1="86" y1="54" x2="98" y2="54" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
        <!-- Shel Rosh Base (Titura) -->
        <rect x="32" y="63" width="44" height="8" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <!-- Main Tefillin Cube (Ketzitzah) -->
        <rect x="38" y="34" width="32" height="29" rx="3" fill="#090D14" stroke="#334155" stroke-width="1.2" />
        <!-- Top Reflection -->
        <line x1="41" y1="36" x2="67" y2="36" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
        <!-- 4 Seams -->
        <line x1="46" y1="36" x2="46" y2="63" stroke="#1E293B" stroke-width="1" />
        <line x1="54" y1="36" x2="54" y2="63" stroke="#1E293B" stroke-width="1" />
        <line x1="62" y1="36" x2="62" y2="63" stroke="#1E293B" stroke-width="1" />
        <!-- Shin (ש) in Gold -->
        <rect x="45" y="43" width="2.2" height="8.5" fill="#F59E0B" />
        <rect x="52.9" y="43" width="2.2" height="8.5" fill="#F59E0B" />
        <rect x="60.8" y="43" width="2.2" height="8.5" fill="#F59E0B" />
        <rect x="45" y="50" width="18" height="2.2" fill="#F59E0B" />
        <rect x="53.2" y="41.5" width="1.6" height="1.2" fill="#FCD34D" />
        <!-- Sparkle Gleam Top-Right -->
        <path fill="#38BDF8" d="M78,24 Q78,27 81,27 Q78,27 78,30 Q78,27 75,27 Q78,27 78,24 Z" />
        <path fill="#FFFFFF" d="M78,25.5 Q78,27 79.5,27 Q78,27 78,28.5 Q78,27 76.5,27 Q78,27 78,25.5 Z" />
      </svg>
    </div>
  </div>
</body>
</html>
