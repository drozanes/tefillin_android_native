<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #0B0F19;
    }
    svg {
      width: 512px;
      height: 512px;
      display: block;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#0B0F19" />
  <!-- Center Glow -->
  <path fill="#151E32" d="M54,18 A36,36 0 1,1 53.99,18 Z" />
  <!-- Precision Mirror Outer Ring -->
  <path stroke="#2E3F66" stroke-width="1.5" fill="none" d="M54,20 A34,34 0 1,1 53.99,20 Z" />
  <!-- Symmetry Guideline -->
  <path stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" d="M54,16 L54,26 M54,78 L54,88" />
  <!-- Shel Rosh Base (Titura) -->
  <path fill="#171C26" stroke="#334155" stroke-width="0.8" d="M32,63 h44 a2,2 0 0,1 2,2 v4 a2,2 0 0,1 -2,2 h-44 a2,2 0 0,1 -2,-2 v-4 a2,2 0 0,1 2,-2 z" />
  <!-- Main Tefillin Cube (Ketzitzah) -->
  <path fill="#0D1117" stroke="#475569" stroke-width="1" d="M38,34 h32 a3,3 0 0,1 3,3 v26 a1,1 0 0,1 -1,1 h-34 a1,1 0 0,1 -1,-1 v-26 a3,3 0 0,1 3,-3 z" />
  <!-- Top Reflection -->
  <path stroke="#64748B" stroke-width="1" d="M40,35.5 h28" />
  <!-- 4 Seams -->
  <path stroke="#1E293B" stroke-width="0.8" d="M46,36 v27 M54,36 v27 M62,36 v27" />
  <!-- Shin (ש) in Gold -->
  <path fill="#F59E0B" d="M45,43 h2.2 v8.5 h-2.2 z" />
  <path fill="#F59E0B" d="M52.9,43 h2.2 v8.5 h-2.2 z" />
  <path fill="#F59E0B" d="M60.8,43 h2.2 v8.5 h-2.2 z" />
  <path fill="#F59E0B" d="M45,50 h18 v2.2 h-18 z" />
  <path fill="#FCD34D" d="M53.2,41.5 h1.6 v1.2 h-1.6 z" />
  <!-- Sparkle Gleam Top-Right -->
  <path fill="#38BDF8" d="M76,26 Q76,29 79,29 Q76,29 76,32 Q76,29 73,29 Q76,29 76,26 Z" />
  <path fill="#FFFFFF" d="M76,27.5 Q76,29 77.5,29 Q76,29 76,30.5 Q76,29 74.5,29 Q76,29 76,27.5 Z" />
</svg>
</body>
</html>
